<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Instagram 인증 완료</title>
</head>
<body style="font-family: sans-serif; padding: 40px; text-align: center;">
  <h2>인증 완료</h2>
  <p>아래 코드를 복사해서 원래 화면(클로드 코드)에 붙여넣어 주세요.</p>
  <div id="code" style="font-size: 20px; padding: 20px; background: #f0f0f0; word-break: break-all; user-select: all;"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    document.getElementById("code").textContent = code || "코드를 찾을 수 없습니다. URL을 확인해주세요.";
  </script>
</body>
</html>
